name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (minimum)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping service
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: |
          if [ -n "$PING_URL" ]; then
            curl -fsS "$PING_URL" >/dev/null
            echo "Pinged $PING_URL successfully"
          else
            echo "PING_URL secret is not set, skipping ping."
          fi
